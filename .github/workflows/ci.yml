name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image builds and answers /healthz
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t open-meteo-mcp .
      - run: |
          docker run -d --rm -p 3000:3000 --name mcp open-meteo-mcp
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/healthz; then echo; exit 0; fi
            sleep 1
          done
          docker logs mcp; exit 1
